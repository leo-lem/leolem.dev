name: Bootstrap Node Environment
description: Set up Node, install dependencies

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm install -g npm@$(npm show npm version)
      shell: bash
    - run: npm ci --ignore-scripts
      shell: bash